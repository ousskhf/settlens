[project]
name = "settlens"
version = "0.1.0"
description = "Dependencies for settlens data engineering project"
authors = [
    {name = "oussama khoufi", email = "ouss.khf@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "google-cloud-storage (>=2.18.0,<3.0.0)",
    "dbt-bigquery (>=1.9.0,<2.0.0)",
    "pandas (>=2.2.3,<3.0.0)",
    "google-cloud-bigquery (>=3.45.1,<4.0.0)"
]


[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "sqlfluff (>=4.3.0,<5.0.0)",
    "sqlfluff-templater-dbt (>=4.3.0,<5.0.0)",
    "black (>=26.5.1,<27.0.0)"
]
