x-airflow-common: &airflow-common
  build: .
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__CORE__DAGS_FOLDER: /opt/repo/airflow/dags
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW__API_AUTH__JWT_SECRET:-settlens_dev_jwt_secret}
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    DBT_PROFILES_DIR: /opt/repo/dbt_settlens
    GOOGLE_APPLICATION_CREDENTIALS: /opt/repo/keys/gcp-service-account.json
  env_file:
    - .env
  volumes:
    - .:/opt/repo
    - airflow-logs:/opt/airflow/logs
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 5

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    # The official entrypoint normally self-registers a passwd entry for the
    # arbitrary AIRFLOW_UID (needed by airflow's getuser() call); bypassing
    # that entrypoint here means we have to do the same registration first.
    command:
      - -c
      - |
        set -e
        if ! whoami &> /dev/null; then
          echo "airflow:x:$(id -u):0::/home/airflow:/bin/bash" >> /etc/passwd
        fi
        airflow db migrate
        airflow users create --username airflow --password airflow --firstname Air --lastname Flow --role Admin --email admin@example.com

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor

  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    ports:
      - "8081:8080"

volumes:
  postgres-db-volume:
  airflow-logs:
