name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: [self-hosted, jetson]
    env:
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      GCP_REGION: ${{ secrets.GCP_REGION }}
      DBT_DATASET: ${{ secrets.DBT_DATASET }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Lint SQL with sqlfluff
        working-directory: dbt_settlens
        run: poetry --directory .. run sqlfluff lint models

      - name: dbt build
        working-directory: dbt_settlens
        run: poetry --directory .. run dbt build
