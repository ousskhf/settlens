---
- name: Deploy settlens Airflow/dbt pipeline to GCE
  hosts: settlens_vm
  become: true

  vars:
    tf_outputs: "{{ lookup('pipe', 'terraform -chdir=../terraform output -json') | from_json }}"
    gcp_project_id: "{{ tf_outputs.project_id.value }}"
    # GCP_REGION feeds dbt's `location:` config (profiles.yml), which must match
    # where the BigQuery datasets actually live (storage_location, "EU"), not
    # the VM's compute region - a mismatch fails every BigQuery job dbt runs.
    gcp_region: "{{ tf_outputs.storage_location.value }}"
    gcp_zone: "{{ tf_outputs.zone.value }}"
    gcs_bucket_name: "{{ tf_outputs.gcs_bucket_name.value }}"
    bq_dataset: "{{ tf_outputs.bq_dataset_id.value }}"
    dbt_dataset: "{{ tf_outputs.dbt_dataset_id.value }}"

    repo_url: "git@github.com:ousskhf/settlens.git"
    repo_dest: /opt/settlens
    deploy_key_path: "/root/.ssh/settlens_deploy_key"
    secrets_dir: "{{ playbook_dir }}/.secrets"

  tasks:
    # --- System-level setup ---
    # Everything here (and below) runs as root: this is a single-purpose
    # deploy VM, so there's no separate unprivileged user to keep files in
    # sync with - AIRFLOW_UID is simply 0, matching the host.

    - name: Install base packages
      ansible.builtin.apt:
        name: [ca-certificates, curl, gnupg, git, make]
        update_cache: true

    - name: Install Docker Engine + Compose plugin
      ansible.builtin.shell: curl -fsSL https://get.docker.com | sh
      args:
        creates: /usr/bin/docker

    - name: Ensure docker service is running
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Create repo directory
      ansible.builtin.file:
        path: "{{ repo_dest }}"
        state: directory
        mode: "0755"

    # --- GitHub deploy key (read-only, single repo) ---

    - name: Ensure /root/.ssh exists
      ansible.builtin.file:
        path: /root/.ssh
        state: directory
        mode: "0700"

    - name: Generate ed25519 deploy keypair if missing
      ansible.builtin.command: >
        ssh-keygen -t ed25519 -f {{ deploy_key_path }} -N "" -C "settlens-airflow-vm-deploy-key"
      args:
        creates: "{{ deploy_key_path }}"

    - name: Read generated public key
      ansible.builtin.slurp:
        src: "{{ deploy_key_path }}.pub"
      register: deploy_pubkey

    - name: Check whether the repo has already been cloned
      ansible.builtin.stat:
        path: "{{ repo_dest }}/.git"
      register: repo_git_dir

    - name: Check the checkout has a valid 'origin' remote
      ansible.builtin.command: git -C {{ repo_dest }} remote get-url origin
      changed_when: false
      failed_when: false
      register: origin_check
      when: repo_git_dir.stat.exists

    - name: Remove a broken/partial checkout from a previously failed clone
      ansible.builtin.file:
        path: "{{ repo_dest }}"
        state: absent
      when: repo_git_dir.stat.exists and origin_check.rc != 0

    - name: Recreate repo directory after cleanup
      ansible.builtin.file:
        path: "{{ repo_dest }}"
        state: directory
        mode: "0755"
      when: repo_git_dir.stat.exists and origin_check.rc != 0

    - name: Show the deploy key if the repo hasn't been cloned yet
      ansible.builtin.debug:
        msg: |
          Add this as a read-only Deploy Key on https://github.com/ousskhf/settlens/settings/keys,
          then rerun this playbook - the git clone task below will fail until you do.

          {{ deploy_pubkey.content | b64decode }}
      when: not repo_git_dir.stat.exists

    - name: Clone (or update) the settlens repo at main
      ansible.builtin.git:
        repo: "{{ repo_url }}"
        dest: "{{ repo_dest }}"
        version: main
        key_file: "{{ deploy_key_path }}"
        accept_hostkey: true

    # --- App configuration ---

    - name: Template .env (deliberately omits GOOGLE_APPLICATION_CREDENTIALS - VM uses its attached service account via ADC)
      ansible.builtin.template:
        src: templates/env.j2
        dest: "{{ repo_dest }}/.env"
        mode: "0600"
      vars:
        airflow_uid_value: "0"
        jwt_secret: "{{ lookup('ansible.builtin.password', secrets_dir + '/jwt_secret.txt', length=40) }}"
        airflow_admin_password: "{{ lookup('ansible.builtin.password', secrets_dir + '/airflow_admin_password.txt', length=20, chars=['ascii_letters', 'digits']) }}"

    - name: Confirm no leftover service-account key file exists
      ansible.builtin.file:
        path: "{{ repo_dest }}/keys"
        state: absent

    # --- Build and run ---

    - name: Download sample raw data (make download-data)
      ansible.builtin.command: make download-data
      args:
        chdir: "{{ repo_dest }}"
      changed_when: true

    - name: Build the Airflow image
      ansible.builtin.command: docker compose build
      args:
        chdir: "{{ repo_dest }}"
      changed_when: true

    - name: Run airflow-init (migrates DB, creates admin user)
      ansible.builtin.command: docker compose up airflow-init
      args:
        chdir: "{{ repo_dest }}"
      changed_when: true

    - name: Start postgres + Airflow services
      ansible.builtin.command: docker compose up -d postgres airflow-scheduler airflow-dag-processor airflow-apiserver
      args:
        chdir: "{{ repo_dest }}"
      changed_when: true

    - name: Show Airflow admin login info
      ansible.builtin.debug:
        msg: >
          Airflow UI: open an IAP tunnel with
          `gcloud compute start-iap-tunnel {{ tf_outputs.instance_name.value }} 8081
          --local-host-port=localhost:8081 --zone {{ gcp_zone }}`, then browse
          http://localhost:8081 and log in as 'airflow' / the password saved at
          {{ secrets_dir }}/airflow_admin_password.txt
