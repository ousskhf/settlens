version: 2

sources:
  - name: settlens_raw
    database: "{{ env_var('GCP_PROJECT_ID') }}"
    schema: raw_settlens

    description: >
      Raw Settlens datasets ingested from Parquet files in GCS
      and exposed through BigQuery external tables.

    tables:

      - name: transactions
        description: >
          Raw payment transaction records. Each row represents
          one payment transaction.

      - name: refunds
        description: >
          Raw refund records linked to payment transactions.

      - name: merchants
        description: >
          Raw merchant master data containing merchant attributes
          such as category, country, tier, risk category, settlement
          currency, and account status.

      - name: disputes
        description: >
          Raw payment dispute records linked to transactions.
          Each row represents a dispute raised against a payment
          transaction.